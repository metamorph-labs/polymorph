<!doctype html>
<html lang="en" data-system="plain" data-palette="neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A screen a model wrote</title>
    <script src="/polymorph/prepaint.js"></script>
    <link rel="stylesheet" href="/polymorph/polymorph.css" />
    <link rel="stylesheet" href="/polymorph/themes/plain.css" />
    <script type="module" src="/polymorph/polymorph.js"></script>
    <script type="module">
      import { loadScreen } from '/polymorph/polymorph.js'

      // What the page heard, for the static-page check (`scripts/gate-no-build.mjs`).
      const heard = { actions: [], faults: [], loadScreen }
      document.addEventListener('poly-action', (event) => heard.actions.push(event.detail))
      document.addEventListener('poly-fault', (event) => heard.faults.push(event.detail))
      window.screenPage = heard
    </script>
  </head>
  <body>
    <poly-screen>
      <script type="application/json" id="document">
        {
          "spec": "polymorph-screen/1",
          "name": "NewContact",
          "purpose": "Adds a contact by their email.",
          "inputs": [{ "name": "onSave", "type": "() => void" }],
          "root": {
            "component": "Stack",
            "props": { "gap": 4, "p": 6 },
            "children": [
              { "component": "Heading", "children": ["New contact"] },
              {
                "component": "FormField",
                "props": { "label": "Email" },
                "children": [
                  { "component": "Input", "props": { "name": "email", "type": "email" } }
                ]
              },
              {
                "component": "Button",
                "props": {
                  "label": "Save",
                  "variant": "solid",
                  "tone": "accent",
                  "onClick": { "$": "onSave" }
                }
              }
            ]
          }
        }
      </script>
    </poly-screen>
  </body>
</html>
