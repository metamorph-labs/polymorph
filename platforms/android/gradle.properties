# The member module compiles about a hundred and twenty Compose files in one
# compilation per target; at Gradle's default heap of 512 MB the Kotlin
# compiler runs out of memory on the Android target. The Kotlin daemon takes its
# heap from `kotlin.daemon.jvmargs`, and Robolectric's test JVM from the test
# task (`ui/build.gradle.kts`).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
