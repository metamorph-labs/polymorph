# Uploads a release to npmjs.com when its tag is pushed. It runs no check: the
# gate runs on the owner's machine, and the release tag's message records the
# commit it passed on (`scripts/publish-packages.mjs`, `--tagged`). This workflow
# exists because npmjs.com's trusted publishing accepts an upload only from a
# GitHub-hosted runner, and the packages trust this file by name.
#
# Run by hand, it is a dry run of the branch or tag it is given: it builds and
# packs every package and uploads nothing.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: The branch or tag to try
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npmjs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REF: ${{ inputs.ref || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      # The checkout can write an annotated tag as a lightweight one, and the gate's
      # record is in the annotation.
      - name: The whole tag, on main
        if: github.event_name == 'push'
        run: |
          git fetch --force origin "refs/tags/$REF:refs/tags/$REF"
          git merge-base --is-ancestor "$REF^{commit}" origin/main
      # A commit from before this workflow has a publish script that would run the
      # whole gate here instead.
      - name: The publish script reads the gate from the tag
        run: |
          grep -q -- "'--tagged'" scripts/publish-packages.mjs ||
            { echo "::error::$REF predates the publish workflow"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/publish-packages.mjs --to npmjs --tagged $DRY_RUN
